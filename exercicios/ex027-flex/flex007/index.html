<!DOCTYPE html>
<html lang="pt-br
">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
</head>
<style>
    .container{
        display: flex;
        background-color: lightblue;
    }

    #i1{
        order: 5;
    }

    #i2{
        order: 8;
    }

    #i3{
        order: 1;
    }

    #i4{
        order: -3;
    }

    #i5{
        order: -5;
    }

    #i6{
        order: -6;
    }

    #i7{
        order: -3;
    }

    .itens{
        background-color: lightcoral;
        border: 1px dashed black;
        padding: 40px;
    }


</style>
<body>
    <div class="container">
        <div class="itens" id="i1">A</div>
        <div class="itens" id="i2">B</div>
        <div class="itens" id="i3">C</div>
        <div class="itens" id="i4">D</div>
        <div class="itens" id="i5">E</div>
        <div class="itens" id="i6">F</div>
        <div class="itens" id="i7">G</div>
    </div>
    
</body>
</html>
