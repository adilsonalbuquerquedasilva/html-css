<!DOCTYPE html>
<html lang="pt-br
">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
</head>
<style>
    .container{
        background-color: lightblue;
        display: flex;
        flex-flow: row wrap;
    }
    .itens{
        background-color: lightcoral;
        border: 1px dashed black;
        padding: 20px;
        flex-basis: 150px;
    }


</style>
<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">Outro conteúdo</div>
        <div class="itens">C</div>
        <div class="itens">Conteúdo um pouco maior</div>
        <div class="itens">E</div>
        <div class="itens">Conteúdo maior ainda, que vai ocupar mais espaço.</div>
        <div class="itens">G</div>
    </div>
    
</body>
</html>
