<!DOCTYPE html>
<html lang="pt-br
">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
</head>
<style>
    .container{
        display: flex;
        flex-flow: row wrap;
        align-items: start;
        background-color: lightblue;
        height: 500px;
    }

    #i1{
        align-self: self-start;
    }

    #i2{
        align-self: auto;
    }

    #i3{
        align-self: flex-end;
    }

    #i4{
        align-self: center;
    }

    #i5{
        align-self: flex-start;
    }

    #i6{
        align-self: auto;
    }

    #i7{
        align-self: stretch;
    }

    .itens{
        background-color: lightcoral;
        border: 1px dashed black;
        padding: 40px;
    }


</style>
<body>
    <div class="container">
        <div class="itens" id="i1">A</div>
        <div class="itens" id="i2">B</div>
        <div class="itens" id="i3">C</div>
        <div class="itens" id="i4">D</div>
        <div class="itens" id="i5">E</div>
        <div class="itens" id="i6">F</div>
        <div class="itens" id="i7">G</div>
    </div>
    
</body>
</html>
