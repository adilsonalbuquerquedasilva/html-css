<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="">
            <p>
                <label for="inu1">Numero:</label>
                <input type="range" id="inu1" min="1" max="20" value="5"
                oninput="val.innerHTML = Number(inu1.value)">
                <output id="val">5</output>
            </p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
    </form>
    
</body>
</html>
