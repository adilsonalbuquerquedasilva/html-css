<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Emplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="imail">Email:</label>
            <input type="email" required autocomplete="email" placeholder="Digite seu email">
        </p>

        <!--Estudar mais sobre REGEX-->
        <p>
            <label for="itel">Telefone</label>
            <input type="tel" id="itel" autocomplete="tel" required pattern="">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
