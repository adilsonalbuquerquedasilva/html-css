<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="">
        <fieldset>
            <input type="radio" id="sexoM" name="sexo">
            <label for="sexoM">Masculino</label>

            <input type="radio" id="sexoF" name="sexo">
            <label for="sexoF">Feminino</label>
        </fieldset>

        <fieldset>
            <legend>Esportes favoritos</legend>

            <input type="checkbox" id="ibas">
            <label for="ibas">Basquete</label><br>
            
            <input type="checkbox" id="ifu">
            <label for="ifu">Futebol</label><br>
            
            <input type="checkbox" id="inat">
            <label for="inat">Natação</label><br>
        
            <input type="checkbox" id="iten">
            <label for="iten">Tênis</label>
            

        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
