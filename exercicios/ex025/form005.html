<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="">
        <fieldset>
            <legend>Esportes favoritos</legend>
            <label for="ibas">
                <input type="checkbox" id="ibas">Basquete
            </label>
            <label for="ifu">
                <input type="checkbox" id="ifu">Futebol
            </label>
            <label for="inat">
                <input type="checkbox" id="inat">Natação
            </label>
            <label for="iten">
                <input type="checkbox" id="iten">Tênis
            </label>

        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
