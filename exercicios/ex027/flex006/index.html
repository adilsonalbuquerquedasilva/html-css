<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
</head>
<style>
    .container{
        height: 600px;
        background-color: cornsilk;
        display: flex;
        flex-flow: row wrap;
        justify-content: space-between;
        align-items: center;
        align-content: space-between;
    }

    .itens{
        background-color: aquamarine;
        width: 200px;
        height: 200px;
        border: 1px dashed black;
    }
</style>
<body>
    <div class="container">
        <div class="itens"></div>
        <div class="itens"></div>
        <div class="itens"></div>
    </div>
    
</body>
</html>
