<!DOCTYPE html>
<html lang="pt-br
">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
</head>
<style>
    .container{
        display: flex;
        background-color: lightblue;
    }
    .itens{
        background-color: lightcoral;
        border: 1px solid black;
        text-align: center;
        padding: 10px;
    }

    #cx1{
        flex: 0 1 150px;
    }

    #cx2{
        flex: 1 3 150px;
    }

    #cx3{
        flex: 3 1 150px;
    }


</style>
<body>
    <div class="container">
        <div class="itens" id="cx1">A</div>
        <div class="itens" id="cx2">B</div>
        <div class="itens" id="cx3">C</div>
    </div>
    
</body>
</html>
