<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        border: 3px dashed black;
        display: grid;
        grid-template: repeat(3,80px) / repeat(3, 150px);
        gap: 10px;
        place-items: normal;
        place-content: normal;
        grid-auto-flow: column;
        grid-auto-rows: 80px;
        grid-auto-columns: 150px;
    }

    .itens{
        border: 3px dashed red;
        padding: 10px;
    }
</style>
<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">F</div>
        <div class="itens">G</div>
        <div class="itens">H</div>
        <div class="itens">I</div>
        <div class="itens">J</div>
    </div>
    
</body>
</html>
